<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Kermi Office</title>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0e0d0c;color:#efe6d6;font:16px/1.6 system-ui,"Segoe UI",Tahoma,sans-serif;text-align:center}
  .c{padding:24px;max-width:420px} h1{font-size:22px;letter-spacing:4px;margin:0 0 8px;color:#c9a96e}
  a{color:#c9a96e} .s{opacity:.7;font-size:14px}
</style>
</head>
<body>
<div class="c">
  <h1>KERMI OFFICE</h1>
  <p id="m">بنوصّلك للمكتب…</p>
  <p class="s" id="s"></p>
</div>
<script>
// The office runs on the owner's PC behind a Cloudflare tunnel; where.json holds its current address.
(async () => {
  const m = document.getElementById('m'), s = document.getElementById('s');
  try {
    const r = await fetch('where.json?t=' + Date.now(), { cache: 'no-store' });
    const { url } = await r.json();
    if (!/^https:\/\/[a-z0-9.-]+$/i.test(url || '')) throw new Error('no address');
    location.replace(url + location.hash);
  } catch (e) {
    m.textContent = 'المكتب مش متاح دلوقتي.';
    s.textContent = 'اتأكد إن الكمبيوتر شغال والتطبيق مفتوح، وجرّب تاني بعد دقيقة.';
  }
})();
</script>
</body>
</html>
